[platformio]
default_envs = sunton_s3_7inch

[env]
platform = espressif32
framework = arduino
lib_deps = lvgl/lvgl@^9.1.0

; Include the shared protocol and define LVGL configuration globally
build_flags = 
    -I ../include/shared_protocol
    
    ; Bypasses the need for lv_conf.h entirely
    -D LV_CONF_SKIP
    
    ; Core LVGL Settings
    -D LV_COLOR_DEPTH=16
    -D LV_COLOR_16_SWAP=0
    -D LV_USE_LOG=1
    -D LV_LOG_PRINTF=1
    
    ; Enable required fonts as discussed in the plan
    -D LV_USE_FONT_MONTSERRAT_14=1
    -D LV_USE_FONT_MONTSERRAT_28=1
    -D LV_USE_FONT_MONTSERRAT_48=1

[env:sunton_s3_7inch]
board = esp32-s3-devkitc-1
build_flags = 
    ${env.build_flags}
    -D BOARD_SUNTON_S3
    -D SCREEN_WIDTH=800
    -D SCREEN_HEIGHT=480
    -D BOARD_HAS_PSRAM
    -D RX_PIN=16
    -D TX_PIN=17

[env:waveshare_p4_10inch]
board = esp32-p4-devkitc
build_flags = 
    ${env.build_flags}
    -D BOARD_WAVESHARE_P4
    -D SCREEN_WIDTH=1024
    -D SCREEN_HEIGHT=600
    -D BOARD_HAS_32MB_PSRAM
    -D RX_PIN=4
    -D TX_PIN=5
