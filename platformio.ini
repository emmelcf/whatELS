; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
extra_scripts = pre:scripts/embed_controller_assets.py
build_src_flags = 
	-Wno-volatile
check_flags = 
	cppcheck: --suppress=*:*.pio/* --suppress=unusedFunction --suppress=compareBoolExpressionWithInt --suppress=knownConditionTrueFalse
build_flags = 
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-I src/core
	-I src/motion
	-I src/motion/kernel
	-I src/motion/modes
	-I src/motion/modes/primitives
	-I src/motion/modes/composite
	-I src/input
	-I src/web
	-I src/display
	-I src
	-I .

; Default development environment: Native USB CDC enabled for upload & monitor; USB keyboard host disabled
[env:esp32s3]
build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ENABLE_USB_KEYBOARD=0
lib_deps = 
	links2004/WebSockets
	techpaul/PS2KeyAdvanced
	bblanchon/ArduinoJson @ ^7.0.0

; Target environment: USB Host enabled for physical USB keyboard (disables native USB CDC device mode)
[env:esp32s3-usb-keyboard]
monitor_port = /dev/ttyACM2
build_flags = 
	${env.build_flags}
	-UARDUINO_USB_MODE
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ENABLE_USB_KEYBOARD=1
lib_deps = 
	links2004/WebSockets
	techpaul/PS2KeyAdvanced
	tanakamasayuki/EspUsbHost@^2.9.1
	bblanchon/ArduinoJson @ ^7.0.0

