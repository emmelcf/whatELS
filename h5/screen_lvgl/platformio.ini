[platformio]
default_envs = sunton_s3_7inch

[env]
platform = espressif32
framework = arduino
lib_deps = lvgl/lvgl@^9.1.0

; Include the shared protocol from the parent directory
build_flags = 
    -I ../include/shared_protocol

[env:sunton_s3_7inch]
board = esp32-s3-devkitc-1
build_flags = 
    ${env.build_flags}
    -D BOARD_SUNTON_S3
    -D SCREEN_WIDTH=800
    -D SCREEN_HEIGHT=480
    -D BOARD_HAS_PSRAM
    -D RX_PIN=16
    -D TX_PIN=17

[env:waveshare_p4_10inch]
board = esp32-p4-devkitc
build_flags = 
    ${env.build_flags}
    -D BOARD_WAVESHARE_P4
    -D SCREEN_WIDTH=1024
    -D SCREEN_HEIGHT=600
    -D BOARD_HAS_32MB_PSRAM
    -D RX_PIN=4
    -D TX_PIN=5
