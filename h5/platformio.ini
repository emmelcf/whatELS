
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    links2004/WebSockets
    techpaul/PS2KeyAdvanced
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
    -I .
check_flags =
    cppcheck: --suppress=compareBoolExpressionWithInt --suppress=knownConditionTrueFalse

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    links2004/WebSockets
    techpaul/PS2KeyAdvanced
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I include
    -I .

